# CI: 전체 테스트 + 데이터 경계 테스트를 별도 잡으로 필수 실행 (SCRUM-51). 외부 API 호출 없음 — 키도 없다.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  boundary:
    name: 데이터 경계·폴백 금지 (필수)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_data_boundary.py tests/test_no_fallback.py
        env: { ANTHROPIC_API_KEY: "" }   # 키가 없어도 통과해야 하고, 있어도 쓰지 않는다
  tests:
    name: 전체 테스트
    runs-on: ubuntu-latest
    needs: boundary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/
